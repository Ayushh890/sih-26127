# NIRNAY full stack: frontend (nginx) · backend API · processing worker · PostgreSQL/PostGIS · Redis
#   cp .env.example .env   # set JWT_SECRET, ENCRYPTION_KEY, PSEUDONYM_SECRET, POSTGRES_PASSWORD
#   docker compose up --build
#   open http://localhost:3000
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://nirnay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nirnay
  REDIS_URL: redis://redis:6379/0
  WORKER_MODE: external
  DATA_DIR: /data

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nirnay
      POSTGRES_USER: nirnay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirnay -d nirnay"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    image: nirnay-backend
    env_file: [{ path: .env, required: false }]
    environment: *backend-env
    volumes: [nirnay-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  worker:
    image: nirnay-backend
    command: ["python", "-m", "app.workers.main"]
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *backend-env
      WORKER_ID: worker-1
    volumes: [nirnay-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  nirnay-data:
